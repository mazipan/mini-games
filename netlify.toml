[build]
  command  = "bun run build"
  publish  = "_site"

# Strip .html extension from any direct .html URL (old bookmarks, scrapers)
[[redirects]]
  from   = "/*.html"
  to     = "/:splat"
  status = 301
  force  = false

# Enforce trailing slash — canonical form is /games/2048/ not /games/2048
[[redirects]]
  from   = "/games/:slug"
  to     = "/games/:slug/"
  status = 301
  force  = false

[build.environment]
  NODE_VERSION = "24.15.0"
  BUN_VERSION  = "1.3.12"
